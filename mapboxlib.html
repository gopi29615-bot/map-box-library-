<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulur to  Gandhipuram</title>
</head>

<body>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 600px;
        }       
    </style>
    </head>

    <body>
        <div id="map"></div>
        <script>
            let stops = [
                [77.19133549, 11.0241],
                [77.024781, 10.997041],
                [76.991592, 10.997455],
                [76.981118, 10.992959],
                [76.966698, 11.020522],
                [77.694626, 8.741222],
                [77.312935, 8.959021],
                [76.936638, 8.524139],
                [-0.173923, 51.529514]
            ];
            function showMarkers() {
                mapboxgl.accessToken = 'pk.eyJ1Ijoic2VudGhpbGt1cHB1c3dhbXkiLCJhIjoiY2twbTlkMzBlMDQxYjJ2bXcwcG5xdnhzNCJ9.mmPcPQN_3raRRh8Q0S1kEw';
                const map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/streets-v11',
                    center: stops[0], // start at Sulur
                    zoom: 11,
                });
                // Create one marker at the first stop
                const marker = new mapboxgl.Marker({
                    color: "red"
                })
                    .setLngLat(stops[0])
                    .addTo(map);

                let i = 0;
                // Move marker from one stop to the next
                function moveMarker() {
                    if (i < stops.length - 1) {
                        i++;
                        marker.setLngLat(stops[i]);
                        // Move the map view to the new stop
                        map.flyTo({
                            center: stops[i],
                            zoom: 13
                        });
                        setTimeout(moveMarker, 2500);
                    }
                }
                // Start moving after 1.5 seconds
                setTimeout(moveMarker, 2500);
            }
            window.onload = showMarkers;


        </script>
    </body>

</html>
